<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf-token" content="{{ csrf_token }}" />
    <meta name="description" content="{{ seo_description }}" />
    <link rel="canonical" href="{{ seo_canonical }}" />
    <meta property="og:title" content="{{ seo_title }}" />
    <meta property="og:description" content="{{ seo_description }}" />
    <meta property="og:type" content="{{ seo_og_type }}" />
    <meta property="og:url" content="{{ seo_canonical }}" />
    <meta property="og:site_name" content="{{ seo_site_name }}" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:image" content="{{ seo_image }}" />
    {% if seo_published_time %}<meta property="article:published_time" content="{{ seo_published_time }}" />{% endif %}
    {% if seo_modified_time %}<meta property="article:modified_time" content="{{ seo_modified_time }}" />{% endif %}
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ seo_title }}" />
    <meta name="twitter:description" content="{{ seo_description }}" />
    <meta name="twitter:image" content="{{ seo_image }}" />
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon" />
    <meta name="robots" content="{{ seo_robots }}" />
    <title>{{ seo_title }}</title>
    {% if seo_jsonld %}<script type="application/ld+json">{{ seo_jsonld }}</script>{% endif %}
    <script async src="https://tally.so/widgets/embed.js"></script>
  </head>
  <body>
    <noscript>
      <p>JavaScript est requis pour utiliser cette application.</p>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/frontend/main.js"></script>
  </body>
</html>
